<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 50th Birthday Amol Patil | 50 Golden Years</title>
  <meta name="description" content="Celebrating 50 Golden Years of Amol Patil. A journey of love and life told in photographs, in Marathi and English." />
  <link rel="icon" href="data:," />
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Noto+Serif+Devanagari:wght@300;400;500;600;700&family=Rozha+One&family=Tiro+Devanagari+Marathi:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════
       LOADER — stack of images fly in
  ═══════════════════════════════════════ -->
  <div id="loader">
    <div class="loader-stack" id="loaderStack"></div>
    <div class="loader-title">
      <span class="loader-name" id="loaderName" data-i18n="site.title"></span>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       LANGUAGE TOGGLE
  ═══════════════════════════════════════ -->
  <div class="lang-toggle" id="langToggle">
    <button class="lang-btn" data-lang="en">EN</button>
    <span class="lang-sep">|</span>
    <button class="lang-btn active" data-lang="mr">मर</button>
  </div>

  <!-- ═══════════════════════════════════════
       MUSIC PLAYER
  ═══════════════════════════════════════ -->
  <div class="music-player" id="musicPlayer">
    <button class="music-toggle" id="musicToggle" title="Toggle music" aria-label="Toggle music">
      <svg class="icon-sound" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path class="wave wave-1" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path class="wave wave-2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
      <svg class="icon-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/>
        <line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
    </button>
    <div class="track-info" id="trackInfo">
      <span class="track-name" id="trackName"></span>
      <div class="track-progress"><div class="track-bar" id="trackBar"></div></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════
       MAIN HORIZONTAL SCROLL CONTAINER
  ═══════════════════════════════════════ -->
  <div id="app">
    <!-- Scroll wrapper — this is what GSAP pins -->
    <div class="scroll-container" id="scrollContainer">
      <div class="slides-track" id="slidesTrack">

        <!-- INTRO SLIDE -->
        <section class="slide slide--intro" id="slide-intro">
          <div class="slide__bg slide__bg--blurred" style="background-image: url('/images/originals/0.jpg')"></div>
          <div class="slide__vignette"></div>
          <div class="intro-content">
            <h1 class="intro-name">
              <span class="intro-dedication" data-i18n="intro.heading">५० व्या वाढदिवसाच्या निमित्ताने —</span>
              <span class="intro-name-line" data-i18n="intro.name">अमोल पाटील</span>
            </h1>
            <p class="intro-tagline" data-i18n="intro.tagline">५० वर्षांचा हा सुंदर जीवनप्रवास अनुभवण्यासाठी स्क्रोल करा →</p>
          </div>
          <div class="scroll-hint">
            <span class="scroll-hint-line"></span>
            <span class="scroll-hint-text">scroll</span>
          </div>
        </section>

        <!-- PHOTO SLIDES injected directly here by slides.js -->

        <!-- OUTRO SLIDE -->
        <section class="slide slide--outro" id="slide-outro">
          <div class="slide__bg slide__bg--blurred" style="background-image: url('/images/originals/0.jpg')"></div>
          <div class="slide__vignette"></div>
          <div class="outro-content">
            <p class="outro-heading" data-i18n="outro.heading">५० व्या वाढदिवसाच्या हार्दिक शुभेच्छा!</p>
            <p class="outro-message" data-i18n="outro.message">तुम्हाला उत्तम आरोग्य, दीर्घायुष्य आणि सदैव सुख-समाधान लाभो हीच प्रार्थना.</p>
          </div>
        </section>

      </div>
    </div>


    <!-- SLIDE COUNTER -->
    <div class="bottom-right">
      <div class="slide-counter" id="slideCounter">
        <span class="counter-current">01</span>
        <span class="counter-sep"> / </span>
        <span class="counter-total">13</span>
      </div>
    </div>
  </div>

  <!-- Cutout edge feather filter -->
  <svg width="0" height="0" style="position: absolute; width: 0; height: 0; pointer-events: none; overflow: hidden;" aria-hidden="true">
    <defs>
      <filter id="feather-cutout" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blurAlpha" />
        <feComposite in="SourceGraphic" in2="blurAlpha" operator="in" />
      </filter>
    </defs>
  </svg>

  <audio id="bgMusic" loop muted></audio>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
